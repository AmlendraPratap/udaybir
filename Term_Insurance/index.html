<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Term Insurance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f7f5;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#075e54;
    margin-bottom:20px;
}

p{
    margin-bottom:20px;
    line-height:1.6;
}

.form-group{
    margin-bottom:18px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

input[type="text"],
input[type="tel"],
input[type="email"],
input[type="date"],
input[type="number"],
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

button{
    width:100%;
    background:#25D366;
    color:#fff;
    border:none;
    padding:15px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1ebc5b;
}

.note{
    color:#666;
    font-size:14px;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="container">

<h2>Term Insurance</h2>

<p>
Dear Sir/Madam,<br><br>

To generate your <b>Term Insurance quotation</b>, kindly share the following details:
</p>

<form id="termForm">

<div class="form-group">
<label>Full Name *</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Mobile Number *</label>
<input type="tel" id="mobile" required>
</div>

<div class="form-group">
<label>Email ID</label>
<input type="email" id="email">
</div>

<div class="form-group">
<label>PIN Code *</label>
<input type="text" id="pincode" required>
</div>

<div class="form-group">
<label>Date of Birth *</label>
<input type="date" id="dob" required>
</div>

<div class="form-group">
<label>Gender</label>
<select id="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Height (cm)</label>
<input type="number" id="height">
</div>

<div class="form-group">
<label>Weight (kg)</label>
<input type="number" id="weight">
</div>

<div class="form-group">
<label>Annual Income / CTC</label>
<input type="text" id="income">
</div>

<div class="form-group">
<label>Occupation</label>
<input type="text" id="occupation">
</div>

<div class="form-group">
<label>Do You Smoke / Consume Tobacco?</label>
<select id="smoker">
<option>No</option>
<option>Yes</option>
</select>
</div>

<div class="form-group">
<label>Existing Medical Conditions</label>
<textarea id="medical" rows="3"></textarea>
</div>

<div class="form-group">
<label>Required Life Cover (₹)</label>
<input type="text" id="cover">
</div>

<div class="form-group">
<label>Preferred Policy Term (Years)</label>
<input type="number" id="term">
</div>

<div class="form-group">
<label>Additional Remarks</label>
<textarea id="remarks" rows="4"></textarea>
</div>

<button type="button" onclick="sendWhatsApp()">
Submit
</button>

</form>

<p class="note">
These details will help us generate the most suitable Term Insurance quotation with the best available premium.
</p>

</div>

<script>

function sendWhatsApp(){

const phone="919810597410"; // Replace with your WhatsApp number

const msg=
`*Term Insurance Quotation Request*

*Full Name:* ${document.getElementById("name").value}

*Mobile:* ${document.getElementById("mobile").value}

*Email:* ${document.getElementById("email").value}

*PIN Code:* ${document.getElementById("pincode").value}

*Date of Birth:* ${document.getElementById("dob").value}

*Gender:* ${document.getElementById("gender").value}

*Height:* ${document.getElementById("height").value} cm

*Weight:* ${document.getElementById("weight").value} kg

*Annual Income / CTC:* ${document.getElementById("income").value}

*Occupation:* ${document.getElementById("occupation").value}

*Smoking/Tobacco:* ${document.getElementById("smoker").value}

*Medical Conditions:* ${document.getElementById("medical").value}

*Required Life Cover:* ${document.getElementById("cover").value}

*Policy Term:* ${document.getElementById("term").value} Years

*Remarks:* ${document.getElementById("remarks").value}`;

window.open(
`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
'_blank'
);

}

</script>

</body>
</html>
